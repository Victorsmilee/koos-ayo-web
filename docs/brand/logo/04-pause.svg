    <circle cx="22" cy="32" r="14"/>
    <circle cx="42" cy="32" r="14"/>
  </g>
  <rect x="29.5" y="14" width="5" height="36" rx="2.5" fill="var(--mark-bg, #F7F9FA)"/>
</svg>
