# Keeps the Supabase project awake.
#
# Free Supabase projects pause after about 7 days of low activity. A survey link
# shared on Monday and quiet until the following Tuesday would pause the project,
# and submissions would start failing while the page still looked completely
# fine. This touches both schemas daily so that cannot happen.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL         the project URL
#   SUPABASE_SECRET_KEY  the secret / service_role key
#
# Remove this workflow if the project ever moves to a paid Supabase plan.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily, off the hour to avoid the rush
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch both schemas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SECRET_KEY must be set as repository secrets."
            exit 1
          fi

          for schema in public staging; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "${SUPABASE_URL}/rest/v1/research_responses?select=id&limit=1" \
              -H "apikey: ${SUPABASE_SECRET_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
              -H "Accept-Profile: ${schema}")

            if [ "$code" != "200" ]; then
              echo "::error::Schema ${schema} returned HTTP ${code}."
              echo "404 usually means the schema is not in Settings -> API -> Exposed schemas."
              exit 1
            fi
            echo "schema ${schema}: ok"
          done
