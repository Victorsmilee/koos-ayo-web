name: CI

# Every pull request, and main after a merge. Nothing is "done" until this is
# green: Product Owner rule, 23 Oct 2026.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: types, tests, guards, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The brand guards are part of the build contract, not a nicety: contrast
      # is a WCAG requirement and the brand docs guard stops the palette table
      # drifting from globals.css.
      - run: python3 scripts/contrast.py
      - run: python3 scripts/check-brand-docs.py
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: build-time-placeholder
          SUPABASE_DB_SCHEMA: staging

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_SCHEMA: staging
      - run: npm run e2e
        env:
          # staging only. These specs write rows, and must never see production.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_DB_SCHEMA: staging
          NEXT_PUBLIC_APP_ENV: preview
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
